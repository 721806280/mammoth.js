name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 26
              uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  registry-url: https://registry.npmjs.org/
                  scope: "@xm721806280"

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

            - name: Verify tag matches package.json version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
                      exit 1
                  fi

            - name: Determine dist-tag
              id: dist-tag
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [[ "$VERSION" == *-* ]]; then
                      echo "tag=rc" >> "$GITHUB_OUTPUT"
                      echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
                  else
                      echo "tag=latest" >> "$GITHUB_OUTPUT"
                      echo "prerelease=" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build browser bundle
              run: make mammoth.browser.min.js

            - name: Publish to npm
              run: npm publish --tag ${{ steps.dist-tag.outputs.tag }} --access public --provenance

            - name: Create GitHub release
              if: startsWith(github.ref, 'refs/tags/v')
              run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes ${{ steps.dist-tag.outputs.prerelease }} mammoth.browser.min.js
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
