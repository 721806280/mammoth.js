name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 26
              uses: actions/setup-node@v4
              with:
                  node-version: "26"
                  registry-url: https://registry.npmjs.org/
                  scope: "@xm721806280"

            - name: Install dependencies
              run: npm install

            - name: Run tests
              run: npm test

            - name: Verify tag matches package.json version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
                      exit 1
                  fi

            - name: Determine dist-tag
              id: dist-tag
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  if [[ "$VERSION" == *-* ]]; then
                      echo "tag=rc" >> "$GITHUB_OUTPUT"
                      echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
                  else
                      echo "tag=latest" >> "$GITHUB_OUTPUT"
                      echo "prerelease=" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build browser bundle
              run: make mammoth.browser.min.js

            - name: Debug OIDC claims
              run: |
                  TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).value))")
                  echo "$TOKEN" | cut -d. -f2 | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const b=JSON.parse(Buffer.from(d,'base64').toString());console.log(JSON.stringify({repository:b.repository,repository_owner:b.repository_owner,repository_owner_id:b.repository_owner_id,workflow:b.workflow,job_workflow_ref:b.job_workflow_ref,environment:b.environment,ref:b.ref},null,2))})"

            - name: Publish to npm
              run: npm publish --tag ${{ steps.dist-tag.outputs.tag }} --access public --provenance

            - name: Create GitHub release
              if: startsWith(github.ref, 'refs/tags/v')
              run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes ${{ steps.dist-tag.outputs.prerelease }} mammoth.browser.min.js
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
